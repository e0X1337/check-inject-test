name: CI
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          echo "Running legitimate CI tests..."
          # Check for malicious content
          if grep -r "MALICIOUS" . --include="*.py" --include="*.js"; then
            echo "SECURITY: Malicious content detected!"
            exit 1
          fi
          echo "All tests passed"
